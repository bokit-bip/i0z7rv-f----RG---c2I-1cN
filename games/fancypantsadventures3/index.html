<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Fancy Pants Adventures: World 3</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0e14;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #game-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    ruffle-player {
      width: 100% !important;
      height: 100% !important;
    }
    #loading-overlay {
      position: absolute;
      inset: 0;
      background: #0b0e14;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      color: #9ba1b0;
      font-size: 14px;
      font-weight: 500;
      z-index: 10;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #f7a01d;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script src="/ruffle/ruffle.js"></script>
</head>
<body>
  <div id="game-container">
    <div id="loading-overlay">
      <div class="spinner"></div>
      <div>Loading Fancy Pants Adventures: World 3 via Ruffle...</div>
    </div>
  </div>

  <script>
    (function() {
      window.RufflePlayer = window.RufflePlayer || {};
      window.RufflePlayer.config = {
        letterbox: "on",
        autoplay: "auto",
        unmuteOverlay: "hidden",
        upgradeToHttps: false,
        warnOnUnsupportedContent: false,
        contextMenu: "rightClick"
      };

      function startRuffle() {
        const container = document.getElementById('game-container');
        const overlay = document.getElementById('loading-overlay');
        
        try {
          const ruffle = window.RufflePlayer.newest ? window.RufflePlayer.newest() : window.RufflePlayer;
          if (!ruffle || !ruffle.createPlayer) {
            throw new Error("Ruffle player factory unavailable");
          }
          const player = ruffle.createPlayer();
          player.id = "ruffle-player";
          container.appendChild(player);

          player.load("fpa3.swf").then(() => {
            if (overlay) {
              overlay.style.opacity = '0';
              setTimeout(() => overlay.remove(), 400);
            }
          }).catch((err) => {
            console.error("Error loading SWF:", err);
            if (overlay) {
              overlay.innerHTML = '<div style="color:#ed4245;font-weight:600;">Failed to load game</div>';
            }
          });

          window.addEventListener('click', () => {
            try { player.focus(); } catch(e) {}
          });
        } catch (e) {
          console.error("Failed to initialize Ruffle:", e);
          if (overlay) {
            overlay.innerHTML = '<div style="color:#ed4245;font-weight:600;">Error initializing Ruffle emulator</div>';
          }
        }
      }

      if (typeof window.RufflePlayer !== 'undefined' && window.RufflePlayer.newest) {
        startRuffle();
      } else {
        const s = document.createElement('script');
        s.src = "/ruffle/ruffle.js";
        s.onload = () => setTimeout(startRuffle, 50);
        document.head.appendChild(s);
      }
    })();
  </script>
</body>
</html>
