<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOOM II</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #000;
            color: #fedb1d;
            overflow: hidden;
        }

        #canvas {
            position: absolute;
            top: 50%;
            left: 50%;
            width: auto;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            background: #000;
            padding: 0;
            margin: 0;
            transform: translate(-50%, -50%);
        }

        .emularity-splash-screen {
            text-align: center;
            position: absolute;
            left: 0;
            right: 0;
            bottom: 50%;
            margin: 0;
            box-sizing: border-box;
            color: #fedb1d;
            font-family: sans-serif;
            font-size: 18px;
        }
    </style>
</head>

<body>
    <canvas id="canvas" onClick="window.focus();"></canvas>
    <script type="text/javascript" src="js/jquery-2.1.1.min.js"></script>
    <script type="text/javascript" src="js/es6-promise.js"></script>
    <script type="text/javascript" src="js/browserfs.min.js"></script>
    <script type="text/javascript" src="js/loader.js"></script>

    <script type="text/javascript">
        function $_GET(param) {
            var vars = {};
            window.location.href.replace(location.hash, '').replace(
                /[?&]+([^=&]+)=?([^&]*)?/gi,
                function(m, key, value) {
                    vars[key] = value !== undefined ? value : '';
                }
            );
            if (param) {
                return vars[param] ? vars[param] : null;
            }
            return vars;
        }

        var softs = {
            DOOM2: {
                file: 'softs/DOOM2.zip',
                cmd: 'DOOM2/DOOM2.EXE',
                pointer: true
            }
        };

        var file = "DOOM2";
        if ($_GET('soft') != null) {
            if (softs[$_GET('soft')] != undefined) {
                file = $_GET('soft');
            }
        }

        function locateAdditionalFiles(filename) {
            if (filename === "dosbox.html.mem") {
                return "js/dosbox-sync.mem";
            }
            return "js/" + filename;
        }

        // DOS FILES
        if (softs[file].machine == undefined) {
            var dosbox = new Emulator(
                document.querySelector("#canvas"),
                null,
                new DosBoxLoader(
                    DosBoxLoader.emulatorJS("js/dosbox-sync.js"),
                    DosBoxLoader.locateAdditionalEmulatorJS(locateAdditionalFiles),
                    DosBoxLoader.nativeResolution(640, 400),
                    DosBoxLoader.mountZip("c", DosBoxLoader.fetchFile("Software", softs[file].file)),
                    DosBoxLoader.startExe(softs[file].cmd)
                )
            );
            dosbox.start({
                waitAfterDownloading: false
            });
        }

        if (softs[file].pointer == false) {
            var c = document.getElementById("canvas");
            if (c) c.style.cursor = "none";
        }
    </script>
</body>
</html>
