<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="grad-skull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a4b"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Petals -->
  <path d="M50 10 C35 25 35 45 50 50 C65 45 65 25 50 10 Z" fill="#ff2a4b" opacity="0.8" />
  <path d="M10 50 C25 35 45 35 50 50 C45 65 25 65 10 50 Z" fill="#4f46e5" opacity="0.8" />
  <path d="M90 50 C75 35 55 35 50 50 C55 65 75 65 90 50 Z" fill="#ff2a4b" opacity="0.8" />
  <path d="M50 90 C35 75 35 55 50 50 C65 55 65 75 50 90 Z" fill="#4f46e5" opacity="0.8" />
  <path d="M22 22 C38 28 42 42 50 50 C42 42 28 38 22 22 Z" fill="#ff4d6d" opacity="0.6" />
  <path d="M78 22 C62 28 58 42 50 50 C58 42 72 38 78 22 Z" fill="#3b82f6" opacity="0.6" />
  <path d="M22 78 C38 72 42 58 50 50 C42 58 28 62 22 78 Z" fill="#818cf8" opacity="0.6" />
  <path d="M78 78 C62 72 58 58 50 50 C58 58 72 62 78 78 Z" fill="#ff2a4b" opacity="0.6" />
  <!-- Skull in center -->
  <g filter="url(#glow)">
    <!-- Cranium -->
    <path d="M38 42 C38 32 62 32 62 42 C62 48 59 52 56 55 L56 61 C56 62 54 63 50 63 C46 63 44 62 44 61 L44 55 C41 52 38 48 38 42 Z" fill="#ffffff" />
    <!-- Eye sockets -->
    <ellipse cx="45" cy="45" rx="3.5" ry="4.5" fill="#06070a"/>
    <ellipse cx="55" cy="45" rx="3.5" ry="4.5" fill="#06070a"/>
    <!-- Nose cavity -->
    <path d="M49 51 L51 51 L50 53 Z" fill="#06070a"/>
    <!-- Teeth -->
    <line x1="47" y1="58" x2="47" y2="62" stroke="#06070a" stroke-width="1"/>
    <line x1="50" y1="58" x2="50" y2="62" stroke="#06070a" stroke-width="1"/>
    <line x1="53" y1="58" x2="53" y2="62" stroke="#06070a" stroke-width="1"/>
  </g>
</svg>
