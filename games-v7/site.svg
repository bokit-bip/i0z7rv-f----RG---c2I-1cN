<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xhtml="http://www.w3.org/1999/xhtml"
     viewBox="0 0 1200 675"
     width="100%" height="100%">
  <title>Games V7 — Skeletal Flowers Retro Arcade</title>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06070a"/>
      <stop offset="50%" stop-color="#0a0c12"/>
      <stop offset="100%" stop-color="#040508"/>
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Static Showcase Banner (For SVG previews and image tags) -->
  <rect width="100%" height="100%" fill="url(#bg-grad)"/>

  <!-- Top Spaced Caps Navigation -->
  <g transform="translate(60, 45)">
    <!-- Skull Brand Icon -->
    <circle cx="20" cy="20" r="16" fill="#161822" stroke="#ff2a4b" stroke-width="1.5"/>
    <text x="20" y="26" fill="#ff2a4b" font-family="'Courier New', monospace" font-size="14" font-weight="900" text-anchor="middle">☠</text>
    
    <text x="48" y="18" fill="#ffffff" font-family="'Courier New', monospace" font-weight="900" font-size="14" letter-spacing="2">GAMES V7</text>
    <text x="48" y="32" fill="#ff2a4b" font-family="'Courier New', monospace" font-weight="700" font-size="10" letter-spacing="1.5">SKELETAL FLOWERS</text>

    <!-- Centered Spaced Nav -->
    <text x="480" y="24" fill="#ff2a4b" font-family="'Courier New', monospace" font-weight="800" font-size="12" letter-spacing="3">HOME</text>
    <line x1="475" y1="32" x2="520" y2="32" stroke="#ff2a4b" stroke-width="2"/>
    <text x="560" y="24" fill="#94a3b8" font-family="'Courier New', monospace" font-weight="700" font-size="12" letter-spacing="3">GAMES</text>
    <text x="645" y="24" fill="#94a3b8" font-family="'Courier New', monospace" font-weight="700" font-size="12" letter-spacing="3">PROXY</text>
    <text x="730" y="24" fill="#94a3b8" font-family="'Courier New', monospace" font-weight="700" font-size="12" letter-spacing="3">CODE EDITOR</text>
    <text x="860" y="24" fill="#94a3b8" font-family="'Courier New', monospace" font-weight="700" font-size="12" letter-spacing="3">SETTINGS</text>

    <!-- Panic / Stealth Badges -->
    <rect x="990" y="6" width="90" height="26" rx="4" fill="#ef4444" opacity="0.2" stroke="#ef4444"/>
    <text x="1035" y="23" fill="#fca5a5" font-family="'Courier New', monospace" font-size="10" font-weight="700" text-anchor="middle">PANIC (~)</text>
  </g>

  <!-- Hero Main Stage Preview -->
  <g transform="translate(60, 150)">
    <text x="0" y="0" fill="#ff2a4b" font-family="'Courier New', monospace" font-size="13" font-weight="700" letter-spacing="3">// DIGITAL VAULT 2026</text>
    
    <!-- CRT Chromatic Glitch Title -->
    <text x="3" y="55" fill="#ff1a40" font-family="'Courier New', monospace" font-size="52" font-weight="900" letter-spacing="6">SKELETAL FLOWERS</text>
    <text x="-3" y="55" fill="#00ffe2" font-family="'Courier New', monospace" font-size="52" font-weight="900" letter-spacing="6">SKELETAL FLOWERS</text>
    <text x="0" y="55" fill="#ffffff" font-family="'Courier New', monospace" font-size="52" font-weight="900" letter-spacing="6">SKELETAL FLOWERS</text>

    <!-- Retro OS Window Frame -->
    <rect x="0" y="90" width="480" height="150" fill="#080a10" stroke="#ffffff" stroke-width="1.5" rx="2"/>
    <rect x="0" y="90" width="480" height="24" fill="#ffffff"/>
    
    <!-- Window Buttons -->
    <g transform="translate(425, 96)">
      <rect x="0" y="0" width="12" height="12" fill="none" stroke="#000" stroke-width="1"/>
      <line x1="2" y1="9" x2="10" y2="9" stroke="#000" stroke-width="1.5"/>
      <rect x="16" y="0" width="12" height="12" fill="none" stroke="#000" stroke-width="1"/>
      <rect x="18" y="2" width="8" height="8" fill="none" stroke="#000" stroke-width="1"/>
      <rect x="32" y="0" width="12" height="12" fill="none" stroke="#000" stroke-width="1"/>
      <line x1="34" y1="2" x2="42" y2="10" stroke="#000" stroke-width="1.5"/>
      <line x1="42" y1="2" x2="34" y2="10" stroke="#000" stroke-width="1.5"/>
    </g>

    <!-- Window Body Text -->
    <text x="24" y="145" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">220+ digitally preserved retro &amp; modern games</text>
    <text x="24" y="170" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="13">with unblocked stealth proxy and live in-browser</text>
    <text x="24" y="192" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="13">development environment. Pure performance, zero latency.</text>

    <!-- Collections Button -->
    <g transform="translate(0, 270)">
      <text x="0" y="16" fill="#ffffff" font-family="'Courier New', monospace" font-size="16" font-weight="900" letter-spacing="4">COLLECTIONS</text>
      <polygon points="150,5 165,13 150,21" fill="#ff2a4b"/>
      <polygon points="147,5 162,13 147,21" fill="#00ffe2" opacity="0.6"/>
    </g>
  </g>

  <!-- Feature Stat Cards Preview -->
  <g transform="translate(60, 520)">
    <rect x="0" y="0" width="245" height="70" rx="4" fill="#0c0e15" stroke="#252936"/>
    <text x="20" y="32" fill="#ff2a4b" font-size="20">🎮</text>
    <text x="56" y="30" fill="#ffffff" font-family="'Courier New', monospace" font-size="16" font-weight="800">220+ GAMES</text>
    <text x="56" y="48" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Playable Retro Catalog</text>

    <rect x="270" y="0" width="245" height="70" rx="4" fill="#0c0e15" stroke="#252936"/>
    <text x="290" y="32" fill="#ff2a4b" font-size="20">🕹️</text>
    <text x="326" y="30" fill="#ffffff" font-family="'Courier New', monospace" font-size="16" font-weight="800">5 RETRO CORES</text>
    <text x="326" y="48" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">NES, SNES, N64, DS, PS1</text>

    <rect x="540" y="0" width="245" height="70" rx="4" fill="#0c0e15" stroke="#252936"/>
    <text x="560" y="32" fill="#06b6d4" font-size="20">🌐</text>
    <text x="596" y="30" fill="#ffffff" font-family="'Courier New', monospace" font-size="16" font-weight="800">STEALTH PROXY</text>
    <text x="596" y="48" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Unblocked Web Gateway</text>

    <rect x="810" y="0" width="245" height="70" rx="4" fill="#0c0e15" stroke="#252936"/>
    <text x="830" y="32" fill="#10b981" font-size="20">💻</text>
    <text x="866" y="30" fill="#ffffff" font-family="'Courier New', monospace" font-size="16" font-weight="800">LIVE IDE</text>
    <text x="866" y="48" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">HTML/JS Developer Sandbox</text>
  </g>

  <!-- Interactive App Runner ForeignObject (Loads the full live application via Blob URL) -->
  <foreignObject x="0" y="0" width="100%" height="100%">
    <xhtml:iframe id="frame" style="width:100%;height:100%;border:0;position:fixed;top:0;left:0;background:#06070a;" allow="autoplay; fullscreen; gamepad; clipboard-read; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></xhtml:iframe>
  </foreignObject>

  <script><![CDATA[
    (function(){
      var frame = document.getElementById("frame");
      if (!frame) return;

      var targetUrl = new URL("index.html?v=7.3", document.baseURI).href;
      fetch(targetUrl)
        .then(function(r){
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.text();
        })
        .then(function(html){
          var baseTag = '<base href="' + new URL("./", targetUrl).href + '">';
          var full = html.includes("<head>") ? html.replace("<head>", "<head>" + baseTag) : (baseTag + html);
          var blob = new Blob([full], { type: "text/html" });
          frame.src = URL.createObjectURL(blob);
          frame.srcdoc = full;
        })
        .catch(function(err){
          frame.src = targetUrl;
        });
    })();
  ]]></script>
</svg>
